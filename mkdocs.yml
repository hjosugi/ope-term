site_name: ope-term
site_description: 運用者と開発者のための、SSH 経路が見えるデスクトップターミナル
site_author: ope-term contributors
site_url: https://hjosugi.github.io/ope-term/
repo_url: https://github.com/hjosugi/ope-term
repo_name: hjosugi/ope-term
edit_uri: edit/main/docs/
copyright: MIT License

docs_dir: docs
site_dir: site
# Broken links and stale nav entries fail the build instead of shipping silently.
strict: true

theme:
  name: material
  language: ja
  logo: assets/icon.svg
  favicon: assets/icon.svg
  # System fonts only. The site makes no third-party requests, like the app itself.
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: ライトテーマへ切り替え
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: ダークテーマへ切り替え
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang:
        - ja
        - en
      separator: '[\s​\-]'

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hjosugi/ope-term
      name: GitHub リポジトリ

nav:
  - はじめに: index.md
  - 起動: GETTING_STARTED.md
  - 使い方: USAGE.md
  - SFTP file manager: SFTP.md
  - Local terminal: LOCAL_TERMINAL.md
  - Session logs: SESSION_LOGS.md
  - 設計:
      - アーキテクチャ: ARCHITECTURE.md
      - 長時間接続と再接続: RELIABILITY.md
      - UI サイズと CSS token: DESIGN_SYSTEM.md
      - ビルド・開発環境: BUILD.md
      - リリース工程: RELEASE.md
      - 性能・安定性のゲート: PERFORMANCE.md
  - セキュリティ:
      - セキュリティ方針: SECURITY_POLICY.md
      - 脅威モデル: THREAT_MODEL.md
      - 端末セキュリティレビュー: TERMINAL_SECURITY.md
      - 依存 advisory レビュー: SECURITY_ADVISORIES.md
  - ロードマップ: ROADMAP.md
