name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: pip install --disable-pip-version-check --requirement requirements-docs.txt
      - run: mkdocs build --strict
      - run: node scripts/docs-policy.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enables GitHub Pages with the Actions source on the first deploy.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v5
