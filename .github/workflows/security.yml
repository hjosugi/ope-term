name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - run: nix develop --command just security
      - run: nix develop --command just sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ope-term-cyclonedx
          path: artifacts/security/ope-term.cdx.json
          if-no-files-found: error

  fuzz:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          toolchain: nightly-2026-07-28
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            src-tauri
            src-tauri/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz OpenSSH config parser
        working-directory: src-tauri
        run: cargo fuzz run ssh_config_parser -- -max_total_time=30 -timeout=10 -verbosity=0
      - name: Fuzz route expansion
        working-directory: src-tauri
        run: cargo fuzz run route_expansion -- -max_total_time=30 -timeout=10 -verbosity=0
      - name: Upload failing fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ope-term-fuzz-artifacts
          path: src-tauri/fuzz/artifacts
          if-no-files-found: ignore
