name: Performance

# Runs the real app (WebKitGTK) in its scripted measurement mode under Xvfb for
# both renderers and gates the reports with the `ci-linux-xvfb` budget profile.
# Software rendering in a VM is not comparable with a real machine, so this
# catches regressions; release decisions use real-machine reports.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkitgtk:
    name: WebKitGTK (Xvfb)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            xauth \
            dbus-x11 \
            libgl1-mesa-dri
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run bundle
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: performance-release
      - name: Build the release app with the embedded frontend
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --bin ope-term
      - name: Measure WebGL and fallback renderers
        env:
          OPE_TERM_PERFORMANCE_NOTES: GitHub-hosted runner, Xvfb software rendering
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" dbus-run-session -- \
            node scripts/performance-autorun.mjs \
              --app src-tauri/target/release/ope-term \
              --output artifacts/performance/ci \
              --renderers fallback,webgl \
              --profile ci-linux-xvfb \
              --label "Ubuntu 22.04 Xvfb (CI)"
      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-webkitgtk-xvfb
          path: artifacts/performance/ci
          if-no-files-found: warn
          retention-days: 30
