name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - run: pnpm run version:check

  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            release_config: ""
          - name: windows-x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            release_config: --config src-tauri/tauri.release.conf.json
          - name: macos-aarch64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            release_config: ""
          - name: macos-x86_64
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            release_config: ""
    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-tools \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile

      - name: Require macOS signing and notarization secrets for tags
        if: startsWith(github.ref, 'refs/tags/v') && startsWith(matrix.name, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for a tagged release"
              exit 1
            fi
          done

      - name: Configure Windows certificate
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        env:
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $windows = @{
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          }
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP "ope-term-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $windows["certificateThumbprint"] = $certificate.Thumbprint
            Remove-Item $pfx -Force
          } elseif ($env:REQUIRE_SIGNING -eq "true") {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD are required for a tagged release"
          }
          @{ bundle = @{ windows = $windows } } |
            ConvertTo-Json -Depth 4 |
            Set-Content src-tauri/tauri.release.conf.json

      - name: Build unsigned bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            ${{ matrix.release_config }}
            -- --locked
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ope-term-[platform]-[arch]-[bundle]

      - name: Build signed bundles
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            ${{ matrix.release_config }}
            -- --locked
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ope-term-[platform]-[arch]-[bundle]

      - name: Verify Linux AppImage media framework
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          appimage="$(find src-tauri/target -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then
            echo "::error::Linux build did not produce an AppImage"
            exit 1
          fi
          appimage="$(realpath "$appimage")"
          extract_dir="$RUNNER_TEMP/ope-term-appimage"
          mkdir -p "$extract_dir"
          (
            cd "$extract_dir"
            "$appimage" --appimage-extract >/dev/null
          )
          plugin="$extract_dir/squashfs-root/usr/lib/gstreamer-1.0/libgstapp.so"
          if [[ ! -f "$plugin" ]]; then
            echo "::error::AppImage is missing the GStreamer appsink plugin: $plugin"
            exit 1
          fi
          appdir="$extract_dir/squashfs-root"
          GST_REGISTRY_1_0="$RUNNER_TEMP/ope-term-gstreamer-registry.bin" \
          GST_REGISTRY_REUSE_PLUGIN_SCANNER=no \
          GST_PLUGIN_SYSTEM_PATH_1_0="$appdir/usr/lib/gstreamer-1.0" \
          GST_PLUGIN_PATH_1_0="$appdir/usr/lib/gstreamer-1.0" \
          GST_PLUGIN_SCANNER_1_0="$appdir/usr/lib/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner" \
          LD_LIBRARY_PATH="$appdir/usr/lib" \
            gst-inspect-1.0 appsink >/dev/null

  stage-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ope-term-*
          path: release-assets

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Generate source SBOM
        run: |
          nix develop --command just sbom
          cp artifacts/security/ope-term.cdx.json release-assets/ope-term.cdx.json

      - name: Stage release assets and generate SHA-256 checksums
        run: node scripts/release-assets.mjs release-assets release-upload

      - name: Attest release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-upload/*

      - name: Preserve staged release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ope-term-release-assets
          path: release-upload
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: stage-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download staged release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ope-term-release-assets
          path: release-upload

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' assets < <(find release-upload -type f -print0)
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "ope-term $GITHUB_REF_NAME" \
            --generate-notes \
            "${assets[@]}"
