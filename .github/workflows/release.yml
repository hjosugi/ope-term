name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm run version:check

  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            release_config: ""
          - name: windows-x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            release_config: --config src-tauri/tauri.release.conf.json
          - name: macos-aarch64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            release_config: ""
          - name: macos-x86_64
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            release_config: ""
    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: startsWith(matrix.name, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile

      - name: Require macOS signing and notarization secrets for tags
        if: startsWith(github.ref, 'refs/tags/v') && startsWith(matrix.name, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for a tagged release"
              exit 1
            fi
          done

      - name: Configure Windows certificate
        if: startsWith(matrix.name, 'windows-')
        shell: pwsh
        env:
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $windows = @{
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          }
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP "ope-term-signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $windows["certificateThumbprint"] = $certificate.Thumbprint
            Remove-Item $pfx -Force
          } elseif ($env:REQUIRE_SIGNING -eq "true") {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD are required for a tagged release"
          }
          @{ bundle = @{ windows = $windows } } |
            ConvertTo-Json -Depth 4 |
            Set-Content src-tauri/tauri.release.conf.json

      - name: Build bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}
            ${{ matrix.release_config }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ope-term-[platform]-[arch]-[bundle]

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: ope-term-*
          path: release-assets

      - uses: cachix/install-nix-action@v31
      - name: Generate source SBOM
        run: |
          nix develop --command just sbom
          cp artifacts/security/ope-term.cdx.json release-assets/ope-term.cdx.json

      - name: Stage release assets and generate SHA-256 checksums
        run: node scripts/release-assets.mjs release-assets release-upload

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release-upload/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' assets < <(find release-upload -type f -print0)
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "ope-term $GITHUB_REF_NAME" \
            --generate-notes \
            "${assets[@]}"
