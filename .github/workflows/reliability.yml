name: Reliability soak

# Periodic fault-injection soak outside the push/PR CI. GitHub-hosted jobs are
# capped at 6 hours, so this is the short automated profile; the 24 h soak runs
# on the lab machine with contrib/systemd (see docs/RELIABILITY.md).
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Soak duration in seconds
        default: "1800"
      fault_every_seconds:
        description: Seconds between injected faults
        default: "60"

permissions:
  contents: read

concurrency:
  group: reliability-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      DURATION: ${{ inputs.duration_seconds || '1800' }}
      FAULT_EVERY: ${{ inputs.fault_every_seconds || '60' }}
      FAULT_MODE: alternate
      HEARTBEAT_SECONDS: "5"
      LISTEN_PORT: "2222"
      PROFILE: ci
      OUT: artifacts/reliability/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies and OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            openssh-server
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: reliability-soak
      - name: Build the headless soak driver
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --example reliability_soak
      - name: Start a local sshd with a dedicated key pair
        run: |
          soak="$RUNNER_TEMP/soak-sshd"
          mkdir -p "$soak" "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$soak/host_ed25519"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/ope_term_soak"
          cp "$HOME/.ssh/ope_term_soak.pub" "$soak/authorized_keys"
          chmod 600 "$soak/authorized_keys"
          cat >"$soak/sshd_config" <<CONFIG
          Port 2022
          ListenAddress 127.0.0.1
          HostKey $soak/host_ed25519
          AuthorizedKeysFile $soak/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          StrictModes no
          PidFile $soak/sshd.pid
          CONFIG
          # Unprivileged sshd: it can only log in as this user, and it does not
          # apply the root-only locked-account check that rejects `runner`.
          /usr/sbin/sshd -t -f "$soak/sshd_config"
          /usr/sbin/sshd -f "$soak/sshd_config" -E "$soak/sshd.log"
          # ope-term resolves the route from ~/.ssh/config; the proxy fronts sshd.
          cat >>"$HOME/.ssh/config" <<CONFIG
          Host ope-term-soak
            HostName 127.0.0.1
            Port $LISTEN_PORT
            User $(id -un)
            HostKeyAlias ope-term-soak-upstream
            IdentityFile ~/.ssh/ope_term_soak
            IdentitiesOnly yes
          CONFIG
          chmod 600 "$HOME/.ssh/config"
          host_key="$(cut -d' ' -f1,2 "$soak/host_ed25519.pub")"
          printf 'ope-term-soak-upstream %s\n[ope-term-soak-upstream]:%s %s\n' \
            "$host_key" "$LISTEN_PORT" "$host_key" >>"$HOME/.ssh/known_hosts"
      - name: Run the fault-injection soak and gate it
        run: |
          unset SSH_AUTH_SOCK
          SOAK_BIN="$PWD/src-tauri/target/release/examples/reliability_soak" \
            scripts/reliability-soak ope-term-soak 127.0.0.1 2022
      - name: Keep the sshd log with the reports
        if: always()
        run: cp "$RUNNER_TEMP/soak-sshd/sshd.log" "$OUT/" 2>/dev/null || true
      - name: Upload soak reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reliability-soak
          path: artifacts/reliability/ci
          if-no-files-found: warn
          retention-days: 30
