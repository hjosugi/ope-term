[package]
name = "ope-term"
version = "0.1.0"
description = "A route-first SSH terminal for operators and developers"
authors = ["hjosugi"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hjosugi/ope-term"
homepage = "https://github.com/hjosugi/ope-term"

[lib]
name = "ope_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["app"]
app = ["dep:bytes", "dep:russh", "dep:tauri", "dep:tauri-build", "dep:tokio", "dep:zeroize"]
fuzzing = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }

[dependencies]
anyhow = "1.0"
bytes = { version = "1.11", optional = true }
dirs = "6.0"
glob = "0.3"
russh = { version = "0.62.3", default-features = false, features = ["aws-lc-rs", "flate2"], optional = true }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [], optional = true }
tokio = { version = "1.48", features = ["sync", "time"], optional = true }
zeroize = { version = "1.8", optional = true }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.23"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0
