[package]
name = "ope-term"
version = "0.1.0"
description = "A route-first SSH terminal for operators and developers"
authors = ["hjosugi"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hjosugi/ope-term"
homepage = "https://github.com/hjosugi/ope-term"

[lib]
name = "ope_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0"
bytes = "1.11"
dirs = "6.0"
glob = "0.3"
russh = "0.62.3"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
tokio = { version = "1.48", features = ["sync", "time"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.23"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0
