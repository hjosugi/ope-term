[package]
name = "ope-term"
version = "0.1.1"
description = "A route-first SSH terminal for operators and developers"
authors = ["hjosugi"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/hjosugi/ope-term"
homepage = "https://github.com/hjosugi/ope-term"

[lib]
name = "ope_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["app"]
app = ["dep:bytes", "dep:portable-pty", "dep:regex", "dep:russh", "dep:russh-sftp", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:time", "dep:tokio", "dep:uuid", "dep:zeroize"]
fuzzing = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }

[dependencies]
anyhow = "1.0"
bytes = { version = "1.11", optional = true }
dirs = "6.0"
glob = "0.3"
libc = "0.2"
portable-pty = { version = "0.9.0", optional = true }
regex = { version = "1.12", optional = true }
russh = { version = "0.63.0", default-features = false, features = ["aws-lc-rs", "flate2"], optional = true }
russh-sftp = { version = "2.4.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
time = { version = "0.3.47", features = ["formatting"], optional = true }
tokio = { version = "1.48", features = ["fs", "io-util", "rt", "sync", "time"], optional = true }
uuid = { version = "1.18", features = ["v4"], optional = true }
zeroize = { version = "1.8", optional = true }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.23"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0
